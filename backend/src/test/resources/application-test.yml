spring:
  datasource:
    url: jdbc:h2:mem:pos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

stripe:
  api-key: sk_test_unit
  webhook-secret: whsec_unit
  success-url: http://localhost/success?session_id={CHECKOUT_SESSION_ID}
  cancel-url: http://localhost/cancel

pos:
  security:
    jwt:
      secret: test-jwt-secret-key-at-least-32-bytes-long!!
      cookie-name: POS_TOKEN
      ttl: PT1H
    cors:
      allowed-origins:
        - http://localhost:5173
    cookie:
      secure: false
      same-site: Lax
